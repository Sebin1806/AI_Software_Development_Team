version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: ai_team_postgres
    environment:
      POSTGRES_USER: username
      POSTGRES_PASSWORD: password
      POSTGRES_DB: ai_software_team
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U username -d ai_software_team"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: ai_team_redis
    ports:
      - "6379:6379"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ai_team_backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://username:password@postgres:5432/ai_software_team
      SECRET_KEY: super-secret-jwt-key-production
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 60
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      OLLAMA_MODEL: llama3.1
      LLM_MOCK_MODE: "false"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - ./generated_projects:/app/generated_projects

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ai_team_frontend
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  postgres_data:
